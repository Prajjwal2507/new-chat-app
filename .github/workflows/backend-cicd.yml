name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Only trigger when backend files change
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        # Only login if it's not a PR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Push only if it's not a PR
          push: ${{ github.event_name != 'pull_request' }}
          # Tag the image with the commit SHA and 'latest'
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pigeon-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pigeon-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Only deploy on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render Deployment
        # Render provides a "Deploy Hook" URL in your web service settings.
        # Hitting this URL triggers Render to pull the latest image and deploy.
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
